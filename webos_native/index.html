<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1, user-scalable=no">
  <title>WiseVodPlayer</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Instant dark shell so there is never a white flash on the TV. -->
  <div id="boot">
    <div class="boot-logo">Wise<span>Vod</span></div>
    <div class="boot-bar"><i></i></div>
  </div>

  <!-- Screens are pushed/popped here by the router. -->
  <div id="app"></div>

  <!-- A single shared toast. -->
  <div id="toast" hidden></div>

  <!-- Classic scripts loaded in dependency order (no ES modules: keeps it
       simple + safe on the webOS Chromium 79 runtime). Everything hangs off the
       global `W` namespace. -->
  <script src="js/lib/mpegts.js"></script>
  <script src="js/core.js"></script>
  <script src="js/api.js"></script>
  <script src="js/language.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/more.js"></script>
  <script src="js/player.js"></script>
  <!-- Optional local-only playlist seed (gitignored); harmless 404 if absent. -->
  <script src="js/seed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
