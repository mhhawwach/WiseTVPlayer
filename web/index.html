<!DOCTYPE html>
<html>
<head>
  <!--
    WiseTVPlayer — Flutter Web entry point
    Targets: LG WebOS (Chromium), standard browsers
  -->
  <!-- ⚠️ webOS Chrome 79 polyfills — DO NOT REMOVE. FinalizationRegistry + WeakRef
       are Chrome 84+ APIs that Flutter 3.44's CanvasKit engine REQUIRES. Without
       them CanvasKit throws "FinalizationRegistry is not a constructor", never
       initialises, and the app shows a grey screen on the TV (verified on
       75NANO75VPA / webOS 6.5.3 / Chrome 79). No-op stubs are enough to boot the
       engine; modern browsers keep their native implementations (guarded). -->
  <script>
    (function () {
      if (typeof window.FinalizationRegistry === 'undefined') {
        window.FinalizationRegistry = function (cb) { this._cb = cb; };
        window.FinalizationRegistry.prototype.register = function () {};
        window.FinalizationRegistry.prototype.unregister = function () {};
      }
      if (typeof window.WeakRef === 'undefined') {
        window.WeakRef = function (t) { this._t = t; };
        window.WeakRef.prototype.deref = function () { return this._t; };
      }
    })();
  </script>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- WebOS: disable text selection and context menu (TV UX) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>WiseVodPlayer</title>
  <link rel="manifest" href="manifest.json">

  <!-- Prevent flash of white background -->
  <style>
    body {
      background-color: #0A0A0F;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    /* Hide scrollbars on WebOS */
    ::-webkit-scrollbar { display: none; }

    /* ── Instant boot screen ──────────────────────────────────────────────
       Shown immediately while CanvasKit's wasm compiles (unavoidable on the
       TV's old Chromium — there is no compiled-module cache on file://). It is
       removed on Flutter's `flutter-first-frame` event, handing off to the
       in-app animated splash. Chrome-79-safe CSS (no `inset` shorthand). */
    #wise-boot {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background-color: #0A0A0F; color: #F0F0F0;
      font-family: -apple-system, Roboto, "Segoe UI", Arial, sans-serif;
      transition: opacity 0.45s ease;
    }
    #wise-boot .wb-title { font-size: 30px; font-weight: 700; letter-spacing: 0.5px; }
    #wise-boot .wb-title b { color: #6C63FF; }
    #wise-boot .wb-spin {
      margin-top: 26px; width: 46px; height: 46px; border-radius: 50%;
      border: 3px solid rgba(108, 99, 255, 0.22);
      border-top-color: #6C63FF;
      -webkit-animation: wb-rot 0.9s linear infinite;
      animation: wb-rot 0.9s linear infinite;
    }
    #wise-boot .wb-sub { margin-top: 20px; font-size: 13px; color: #8A8A9A; }
    @-webkit-keyframes wb-rot { to { -webkit-transform: rotate(360deg); } }
    @keyframes wb-rot { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Instant boot screen — covers the CanvasKit wasm compile; removed on first frame. -->
  <div id="wise-boot">
    <div class="wb-title">Wise<b>Vod</b>Player</div>
    <div class="wb-spin"></div>
    <div class="wb-sub">Loading…</div>
  </div>
  <script>
    (function () {
      function hideBoot() {
        var el = document.getElementById('wise-boot');
        if (!el) return;
        el.style.opacity = '0';
        window.setTimeout(function () {
          if (el && el.parentNode) el.parentNode.removeChild(el);
        }, 500);
      }
      // Flutter fires this on window when the first frame paints.
      window.addEventListener('flutter-first-frame', hideBoot);
    })();
  </script>

  <!-- mpegts.js — plays MPEG-TS (.ts) live streams via MSE. WebOS Chromium
       cannot play raw MPEG-TS in a bare <video>, and Xtream live channels are
       /live/.../<id>.ts, so this is required for live TV on webOS. -->
  <script src="mpegts.js"></script>
  <script>
    // Bridge called from Dart (web_player_impl.dart). Routes .ts streams
    // through mpegts.js; everything else (MP4/MKV/HLS) uses the native <video>.
    (function () {
      function isTs(u) { return /\.ts(\?|#|$)/i.test(u); }
      function playNative(video, url) {
        video.src = url;
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
      }
      window.wisetvOpen = function (video, url) {
        if (!video) return false;
        // Tear down any mpegts player attached to this element first.
        if (video._wisetvPlayer) {
          try { video._wisetvPlayer.destroy(); } catch (e) {}
          video._wisetvPlayer = null;
        }
        var canTs = window.mpegts && mpegts.getFeatureList &&
            mpegts.getFeatureList().mseLivePlayback;
        if (isTs(url) && canTs) {
          try {
            var player = mpegts.createPlayer(
              { type: 'mpegts', isLive: true, url: url },
              { liveBufferLatencyChasing: true, enableWorker: true });
            player.attachMediaElement(video);
            player.load();
            var pp = video.play();
            if (pp && pp.catch) pp.catch(function () {});
            video._wisetvPlayer = player;
            return true;
          } catch (e) {
            // Fall back to native if mpegts fails to init.
            playNative(video, url);
            return true;
          }
        }
        playNative(video, url);
        return true;
      };
      window.wisetvDispose = function (video) {
        if (!video) return;
        if (video._wisetvPlayer) {
          try { video._wisetvPlayer.destroy(); } catch (e) {}
          video._wisetvPlayer = null;
        }
        try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}
      };
    })();
  </script>

  <!-- This script installs the Flutter service worker and bootstraps the app.
       LG WebOS Chromium supports service workers from WebOS 4+ -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    WebOS Magic Remote key codes (for reference — handled in Dart via
    LogicalKeyboardKey in the player screens):
      Back       = 461  (maps to LogicalKeyboardKey.goBack)
      Enter/OK   = 13   (LogicalKeyboardKey.enter)
      Up/Down/Left/Right = arrow keys
      Play/Pause = 415 / 19
      Stop       = 413
      Fast Fwd   = 417
      Rewind     = 412
      Red        = 403
      Green      = 404
      Yellow     = 405
      Blue       = 406
  -->
</body>
</html>
